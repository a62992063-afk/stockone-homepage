name: Inspect Daum site registration
on:
  push:
    branches: [search-registration-check]
    paths: ['.github/workflows/daum-registration-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect registration form
        run: |
          npm install --prefix /tmp/registration playwright
          /tmp/registration/node_modules/.bin/playwright install --with-deps chromium
          cat > /tmp/registration/check.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch();const p=await b.newPage();
            p.on('dialog',async d=>{console.log('FORM_ALERT '+d.message());if(d.type()==='confirm'&&/등록|신청/.test(d.message()))await d.accept();else await d.dismiss()});
            const r=await p.goto('https://register.search.daum.net/searchForm.daum?act=insert',{waitUntil:'networkidle',timeout:45000});
            console.log('HTTP_STATUS '+r.status());
            await p.locator('#url2').fill('a62992063-afk.github.io/stockone-homepage/');
            await p.getByRole('button',{name:'확인',exact:true}).first().click();
            await p.waitForTimeout(1500);
            await p.locator('input[name="agree"]').nth(0).check();
            await p.locator('input[name="agree"]').nth(1).check();
            await p.getByRole('button',{name:'확인',exact:true}).click();
            await p.waitForTimeout(1000);
            await p.locator('#title').fill('스탁원');
            await p.locator('#desc').fill('매장과 창고의 재고조사 서비스를 안내하는 스탁원 홈페이지');
            await p.locator('#site_desc_category').fill('매장 재고조사, 창고 재고조사, 정기 재고실사');
            await p.locator('input[name="reg_name"]').fill('songeunmi');
            await p.locator('input[name="email1"]').fill('stockone0615');
            await p.locator('select[name="email3"]').selectOption('gmail.com');
            console.log('CATEGORY_LINKS '+JSON.stringify(await p.locator('input[name="dir_path"]').locator('..').evaluate(e=>({text:e.innerText,links:Array.from(e.querySelectorAll('a,button')).map(a=>({tag:a.tagName,text:a.innerText,href:a.getAttribute('href'),onclick:a.getAttribute('onclick')}))}))));
            await p.locator('input[name="dir_path"]').locator('..').getByText('검색',{exact:true}).click();
            await p.waitForTimeout(1000);
            const category=p.context().pages().find(view=>view.url().includes('categoryDepthSearch'));
            await category.locator('input[name="dirKeyword"]').fill('경영');
            await category.getByRole('button',{name:'확인',exact:true}).click();
            await category.waitForTimeout(500);
            const selectedIndex=await category.locator('input[name="dir_radio"]').evaluateAll(xs=>xs.findIndex(x=>{
              let e=x.parentElement;const wanted='비즈니스,쇼핑>컨설팅>경영컨설팅';
              while(e&&e.querySelectorAll('input[name="dir_radio"]').length===1){
                if(Array.from(e.textContent).filter(c=>c.charCodeAt(0)>32).join('')===wanted)return true;
                e=e.parentElement;
              }return false;
            }));
            if(selectedIndex<0)throw Error('No exact related category found');
            try{await category.locator('input[name="dir_radio"]').nth(selectedIndex).check();}catch(e){if(!category.isClosed())throw e;}
            await p.waitForTimeout(500);
            console.log('SELECTED_DIRECTORY '+await p.locator('input[name="dir_path"]').inputValue());
            await p.locator('#regComfirmBtn').click();
            await p.waitForTimeout(1500);
            console.log('SUBMISSION_PAGE '+p.url());
            console.log('SUBMISSION_TEXT '+await p.locator('body').innerText());
            for(const view of p.context().pages()){console.log('CATEGORY_VIEW '+view.url());console.log('CATEGORY_BODY '+(await view.locator('body').innerText()).slice(0,16000));console.log('CATEGORY_FIELDS '+JSON.stringify(await view.locator('input:not([type=hidden]),select,button,a').evaluateAll(xs=>xs.filter(x=>x.offsetWidth||x.offsetHeight||x.getClientRects().length).map(x=>({tag:x.tagName,type:x.type,id:x.id,name:x.name,text:x.innerText,href:x.getAttribute('href'),onclick:x.getAttribute('onclick')})))));}
            console.log('CURRENT_URL '+p.url());
            console.log('FORM_TEXT '+(await p.locator('body').innerText()).slice(0,12000));
            console.log('FORM_FIELDS '+JSON.stringify(await p.locator('input:not([type=hidden]),select,button').evaluateAll(xs=>xs.map(x=>({tag:x.tagName,type:x.type,id:x.id,name:x.name,placeholder:x.placeholder,text:x.innerText,options:x.tagName==='SELECT'?Array.from(x.options).map(o=>({text:o.text,value:o.value})):undefined,visible:!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length)})))));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/registration/check.cjs
