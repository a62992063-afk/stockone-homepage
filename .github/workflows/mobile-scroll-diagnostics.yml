name: Diagnose mobile scrolling
on:
  push:
    branches: [diagnose-mobile-scroll]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install playwright pngjs
          npx playwright install --with-deps chromium firefox
      - name: Check mobile scrolling
        run: |
          cat > check.cjs <<'JS'
          const {chromium,firefox}=require('playwright');
          const {PNG}=require('pngjs');
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('screenshots');
            const result=[];
            for (const [name,type] of [['chromium',chromium],['firefox',firefox]]) {
              const browser=await type.launch();
              const context=await browser.newContext({viewport:{width:393,height:800},deviceScaleFactor:1,userAgent:'Mozilla/5.0 (Linux; Android 14; SM-S911N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36'});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const response=await page.goto('https://a62992063-afk.github.io/stockone-homepage/?qa=static-scroll',{waitUntil:'networkidle'});
              const states=[];
              const height=await page.evaluate(()=>document.documentElement.scrollHeight);
              for(const y of [0,1500,3000,height-800,3000,1500,0]){
                await page.evaluate(y=>window.scrollTo(0,y),y);
                await page.waitForTimeout(300);
                const png=PNG.sync.read(await page.screenshot());
                let black=0;
                for(let i=0;i<png.data.length;i+=4)if(png.data[i]<5&&png.data[i+1]<5&&png.data[i+2]<5)black++;
                states.push({y,blackFraction:black/(png.width*png.height)});
              }
              await page.screenshot({path:'screenshots/'+name+'-top.png'});
              await page.locator('.partners-section').scrollIntoViewIfNeeded();
              await page.screenshot({path:'screenshots/'+name+'-logos.png'});
              const images=await page.locator('img').evaluateAll(items=>items.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src').slice(0,120)));
              result.push({browser:name,status:response.status(),height,states,errors,brokenImages:images});
              await browser.close();
            }
            fs.writeFileSync('screenshots/result.json',JSON.stringify(result,null,2));
            console.log('RENDER_RESULT '+JSON.stringify(result));
            if(result.some(r=>r.status!==200||r.errors.length||r.brokenImages.length||r.states.some(s=>s.blackFraction>.9)))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-scroll-diagnostics
          path: screenshots/
          retention-days: 3
